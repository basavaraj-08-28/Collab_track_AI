<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ct-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4338CA" />
      <stop offset="50%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#8B5CF6" />
    </linearGradient>
    <linearGradient id="ct-orbit-1" x1="20" y1="20" x2="80" y2="80">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#818CF8" />
      <stop offset="100%" stopColor="#C084FC" />
    </linearGradient>
    <linearGradient id="ct-orbit-2" x1="80" y1="20" x2="20" y2="80">
      <stop offset="0%" stopColor="#F472B6" />
      <stop offset="50%" stopColor="#A78BFA" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
    <linearGradient id="ct-core" x1="35" y1="35" x2="65" y2="65">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E0E7FF" />
    </linearGradient>
    <filter id="ct-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#ct-bg)" />
  <rect x="7" y="7" width="86" height="43" rx="25" fill="white" fill-opacity="0.12" />

  <!-- Orbit 1 -->
  <ellipse cx="50" cy="50" rx="30" ry="17" transform="rotate(-28 50 50)" stroke="url(#ct-orbit-1)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="140 30" opacity="0.95" />

  <!-- Orbit 2 -->
  <ellipse cx="50" cy="50" rx="30" ry="17" transform="rotate(32 50 50)" stroke="url(#ct-orbit-2)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="130 40" opacity="0.85" />

  <!-- Team Member Nodes -->
  <circle cx="28" cy="34" r="5" fill="#38BDF8" filter="url(#ct-glow)" />
  <circle cx="28" cy="34" r="2.5" fill="#FFFFFF" />

  <circle cx="72" cy="34" r="5" fill="#C084FC" filter="url(#ct-glow)" />
  <circle cx="72" cy="34" r="2.5" fill="#FFFFFF" />

  <circle cx="50" cy="72" r="5.5" fill="#F472B6" filter="url(#ct-glow)" />
  <circle cx="50" cy="72" r="2.8" fill="#FFFFFF" />

  <!-- Neural Connection Links -->
  <line x1="28" y1="34" x2="50" y2="48" stroke="#E0E7FF" stroke-width="1.8" stroke-dasharray="3 2" stroke-opacity="0.75" />
  <line x1="72" y1="34" x2="50" y2="48" stroke="#E0E7FF" stroke-width="1.8" stroke-dasharray="3 2" stroke-opacity="0.75" />
  <line x1="50" y1="72" x2="50" y2="48" stroke="#E0E7FF" stroke-width="1.8" stroke-dasharray="3 2" stroke-opacity="0.75" />

  <!-- Core AI Spark -->
  <g filter="url(#ct-glow)">
    <path d="M 50 38 L 54.5 48 L 60 50 L 54.5 52 L 50 62 L 45.5 52 L 40 50 L 45.5 48 Z" fill="url(#ct-core)" />
    <circle cx="50" cy="50" r="3" fill="#FFFFFF" />
  </g>
</svg>